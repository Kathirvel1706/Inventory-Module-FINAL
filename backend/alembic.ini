# A generic, single database configuration.

[alembic]
# path to migration script
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters which # will trim the description field to
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of whether
# autogenerate is true
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be detected as revisions
# sourceless = false

# version location specification; This defaults
# to alembic/versions.  When multiple version
# directories are required, initial_part allows
# specify standard prefix for target directory
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# set to 'true' to search source_path recursively for migrations
# recursive_version_locations = false

# output_encoding option; defaults to utf-8.
output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/garment_inventory

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
